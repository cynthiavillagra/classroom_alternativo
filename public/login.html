<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Classroom Explorer</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header class="header">
        <div class="header__logo">
            <span class="header__icon">📚</span>
            <h1 class="header__title">Classroom Explorer</h1>
        </div>
        <nav class="header__nav">
            <a href="/" class="btn btn--secondary">← Volver</a>
        </nav>
    </header>

    <main class="main">
        <section class="login-section">
            <div class="login-card">
                <h2>🔐 Iniciar Sesión</h2>
                <p>Accede con tu cuenta de Google para ver tus cursos de Classroom.</p>

                <a href="/api/auth/login" class="btn btn--primary btn--large">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Continuar con Google
                </a>

                <p class="login-note">
                    <small>
                        Solo necesitamos acceso de lectura a tus cursos.
                        No modificamos nada en tu Classroom.
                    </small>
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>
            Classroom Explorer — Python POO sin frameworks
        </p>
    </footer>

    <style>
        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }

        .login-card {
            background: var(--color-bg-card);
            padding: 3rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
            max-width: 400px;
        }

        .login-card h2 {
            margin-bottom: 1rem;
        }

        .login-card p {
            color: var(--color-text-secondary);
            margin-bottom: 2rem;
        }

        .login-card .btn {
            width: 100%;
            justify-content: center;
        }

        .login-card svg {
            margin-right: 0.5rem;
        }

        .login-note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
    </style>
</body>

</html>
